<!-- index.html -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>عجلة الحظ للبث</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <div class="wheel-panel">
        <div class="wheel-wrap">
          <div class="pointer"></div>
          <div class="wheel-center">
            <span>دور</span>
          </div>
          <div id="wheel" class="wheel" aria-label="عجلة الحظ"></div>
        </div>
      </div>

      <div class="side-panel">
        <div class="header">
          <p class="eyebrow">LIVE HOST</p>
          <h1>عجلة الحظ</h1>
        </div>

        <div class="stats">
          <div class="stat">
            <span>اللاعبين</span>
            <strong id="playerCount">0</strong>
          </div>
          <div class="stat">
            <span>الفائز</span>
            <strong id="winnerBadge">-</strong>
          </div>
        </div>

        <div class="controls">
          <input
            id="playerInput"
            type="text"
            maxlength="20"
            placeholder="أدخل اسم لاعب"
            aria-label="اسم اللاعب"
          />
          <div class="button-row">
            <button id="addPlayerBtn" class="primary">إضافة</button>
            <button id="resetBtn" class="secondary">إعادة تعيين</button>
          </div>
        </div>

        <div class="players-box">
          <div class="players-header">
            <h2>قائمة اللاعبين</h2>
            <button id="clearBtn" class="tiny">مسح</button>
          </div>

          <ul id="playersList" class="players-list"></ul>
        </div>

        <button id="spinBtn" class="spin-btn" disabled>ابدأ الدوران</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
